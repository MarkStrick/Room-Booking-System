<text x="70" y="1355" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#63738A">Dashed = application reference in JSONB; solid = enforced FK. Supabase Auth tables are not used by this app.</text>
<text x="70" y="1386" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#63738A">flows are pre-login OAuth state / nonce / PKCE records. attempts also stores actorId = 0 rate counters.</text>
<text x="70" y="1417" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#63738A">Gray = retained legacy password tables. Their presence does not mean self-registration is enabled.</text>
