name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Room-Booking-System
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Room-Booking-System/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:backend
      - run: npm run build
      - run: npm audit --omit=dev
